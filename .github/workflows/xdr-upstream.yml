name: XDR upstream

# Compares the vendored xdr/xdr.json with the upstream file at its pinned commit. That
# file never changes, so the result can only change with the files below; running on
# every push would only add a job that fails when the network does. The tests check
# the file against its recorded sha256 on every run, without the network.
on:
  push:
    branches: [main]
    paths:
      - xdr/**
      - scripts/update_xdr.py
      - .github/workflows/xdr-upstream.yml
  pull_request:
    paths:
      - xdr/**
      - scripts/update_xdr.py
      - .github/workflows/xdr-upstream.yml

permissions: {}

env:
  UV_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xdr-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: make check-xdr
