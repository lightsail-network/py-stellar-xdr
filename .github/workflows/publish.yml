name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

# Never run two releases at once, and never cancel one that has started.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  UV_LOCKED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(uv version --short)"
      # CI already checks main, but a tag can point at any commit, so check again here.
      - run: make check
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stellar-xdr/
    permissions:
      id-token: write # trusted publishing and the attestations both need an OIDC token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Used instead of uv publish, which can upload attestations but not create them.
      # This action signs PEP 740 attestations for the files, so that users can verify
      # that they were built by this workflow.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
